<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b2ff7"/>
      <stop offset="100%" style="stop-color:#f222b5"/>
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEE440"/>
      <stop offset="100%" style="stop-color:#ff9f43"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Shine -->
  <ellipse cx="180" cy="140" rx="120" ry="60" fill="rgba(255,255,255,0.12)"/>

  <!-- Coin body -->
  <circle cx="256" cy="272" r="155" fill="url(#coin)"/>
  <circle cx="256" cy="265" r="155" fill="url(#coin)"/>

  <!-- Coin edge shading -->
  <circle cx="256" cy="265" r="155" fill="none" stroke="#c8840a" stroke-width="10"/>
  <circle cx="256" cy="265" r="140" fill="#FFD000"/>
  <circle cx="256" cy="265" r="130" fill="url(#coin)"/>

  <!-- YP text -->
  <text x="256" y="220" font-family="Arial Black, sans-serif" font-weight="900" font-size="88" fill="#c8840a" text-anchor="middle" dominant-baseline="middle" opacity="0.25">YP</text>
  <text x="256" y="216" font-family="Arial Black, sans-serif" font-weight="900" font-size="88" fill="#7b2ff7" text-anchor="middle" dominant-baseline="middle">YP</text>

  <!-- Dollar sign -->
  <text x="256" y="316" font-family="Arial Black, sans-serif" font-weight="900" font-size="52" fill="#c8840a" text-anchor="middle" dominant-baseline="middle">🪙</text>
</svg>
